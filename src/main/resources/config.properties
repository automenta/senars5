# SeNARS Configuration
# LLM Configuration
# The base URL of the Ollama API endpoint
llm.api.url=http://localhost:11434
# The name of the model to use (e.g., "llama3", "mistral")
llm.model.name=mistral
# Timeout for the LLM API calls in seconds
llm.api.timeout=60
# Data Persistence Configuration
# File path for the serialized vector store
vectorstore.filepath=./data/vector_store.json
# File path for the serialized graph database
graphdb.filepath=./data/graph_db.json
